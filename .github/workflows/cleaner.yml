name: ChatGPT Cleaner

on:
  workflow_dispatch:

  schedule:
    - cron: "0 8 * * *"

jobs:
  clean:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Playwright
        run: |
          playwright install --with-deps chromium

      - name: Restore sessions
        run: |
          echo "${{ secrets.SESSIONS_ZIP }}" | base64 -d > sessions.zip
          unzip -o sessions.zip

      - name: Run cleaner
        run: |
          python cleaner.py